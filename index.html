<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi Rutina</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22%3E%3Crect width=%22180%22 height=%22180%22 fill=%22url(#g)%22/%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22#1a1e25%22/%3E%3Cstop offset=%221%22 stop-color=%22#0b0d10%22/%3E%3C/linearGradient%3E%3C/defs%3E %3Ccircle cx=%2290%22 cy=%2290%22 r=%2256%22 fill=%22none%22 stroke=%22#262b34%22 stroke-width=%2216%22/%3E %3Ccircle cx=%2290%22 cy=%2290%22 r=%2256%22 fill=%22none%22 stroke=%22#4ade80%22 stroke-width=%2216%22 stroke-linecap=%22round%22 stroke-dasharray=%22263.9 351.9%22 transform=%22rotate(-90 90 90)%22/%3E %3Cg fill=%22#eceef2%22%3E%3Crect x=%2262%22 y=%2280%22 width=%2210%22 height=%2220%22 rx=%223%22/%3E%3Crect x=%22108%22 y=%2280%22 width=%2210%22 height=%2220%22 rx=%223%22/%3E%3Crect x=%2270%22 y=%2273%22 width=%229%22 height=%2234%22 rx=%223%22/%3E%3Crect x=%22101%22 y=%2273%22 width=%229%22 height=%2234%22 rx=%223%22/%3E%3Crect x=%2278%22 y=%2287%22 width=%2224%22 height=%226%22 rx=%222%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<style>
/* ===== 1. TOKENS ===== */
:root{
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --t-xs:.75rem;--t-sm:.875rem;--t-md:1rem;--t-lg:1.25rem;--t-xl:1.5rem;--t-2xl:2.125rem;
  --bg:#0d0f12;--s1:#15181d;--s2:#1c2027;--s3:#262b34;--line:#2a2f38;
  --txt:#eceef2;--txt-2:#a6aebb;--txt-3:#808997;
  --accent:#4ade80;--accent-soft:#4ade8024;--accent-line:#4ade8066;--on-accent:#06120b;
  --up:#4ade80;--down:#f87171;--gold:#fbbf24;--gold-soft:#fbbf2422;
  --r-sm:8px;--r-md:14px;--r-lg:22px;--r-full:999px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --nav-h:64px;
}
/* ===== 2. BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.45;}
body{max-width:560px;margin:0 auto;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--sp-5));min-height:100vh;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font:inherit;color:var(--txt);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;}
.hidden{display:none!important;}

/* ===== 3. HEADER ===== */
.top{position:relative;padding:calc(env(safe-area-inset-top) + var(--sp-3)) var(--sp-4) var(--sp-3);}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-2);}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);background:var(--s2);color:var(--txt-2);font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;}
.chip.accent{background:var(--accent-soft);color:var(--accent);}
.chip.on{background:var(--accent);color:var(--on-accent);}
.hero{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);}
.eyebrow{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);min-height:1.1em;}
.hero h1{font-size:clamp(1.6rem,7.6vw,var(--t-2xl));font-weight:800;letter-spacing:-.03em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero .sub{font-size:var(--t-sm);color:var(--txt-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero-txt{min-width:0;}
.ring{flex:0 0 64px;position:relative;width:64px;height:64px;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring .ring-fg{transition:stroke-dashoffset .5s var(--ease);}
.ring-lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.ring-lbl b{font-family:var(--num);font-size:var(--t-lg);font-weight:800;}
.ring-lbl small{font-size:10px;color:var(--txt-3);margin-top:2px;}

/* barra compacta al scrollear */
.mini-bar{position:fixed;top:0;left:0;right:0;z-index:25;background:#0d0f12eb;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) var(--sp-4) 8px;transform:translateY(-110%);transition:transform .25s var(--ease);}
.mini-bar.show{transform:none;}
.mini-in{display:flex;align-items:center;gap:var(--sp-3);width:100%;max-width:528px;margin:0 auto;text-align:left;}
.mini-in .mt{flex:1;min-width:0;}
.mini-in .mt b{display:block;font-size:var(--t-md);font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-in .mt span{display:block;font-size:var(--t-xs);color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mring{position:relative;flex:0 0 36px;width:36px;height:36px;}
.mring svg{transform:rotate(-90deg);display:block;}
.mring i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;}

/* tira semanal */
.week-h{display:flex;justify-content:space-between;align-items:baseline;margin:var(--sp-5) 0 var(--sp-2);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);}
.week-h b{color:var(--txt);font-size:var(--t-xs);letter-spacing:.02em;text-transform:none;}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--sp-1);align-items:start;}
.wd{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;}
.wd .wc{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--t-sm);background:var(--s2);color:var(--txt-2);transition:box-shadow .2s,background .2s;}
.wd .wc>span{position:relative;}
.wd .wg{font-size:10px;font-weight:600;color:var(--txt-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wd.st-rest .wc{background:transparent;border:1px dashed var(--line);color:var(--txt-3);}
.wd.st-partial .wc{background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--s3) 0);}
.wd.st-partial .wc::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--s2);}
.wd.st-done .wc{background:var(--accent);color:var(--on-accent);}
.wd.today .wg{color:var(--accent);font-weight:800;}
.wd.sel .wc{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--txt);}
.pills{display:flex;gap:var(--sp-2);overflow-x:auto;margin-top:var(--sp-4);scrollbar-width:none;padding-bottom:2px;}
.pills::-webkit-scrollbar{display:none;}
.pill{flex:0 0 auto;padding:9px 16px;border-radius:var(--r-full);background:var(--s2);color:var(--txt-2);font-size:var(--t-sm);font-weight:700;white-space:nowrap;}
.pill.st-done{background:var(--accent-soft);color:var(--accent);}
.pill small{font-family:var(--num);opacity:.75;}
.pill.sel{background:var(--accent);color:var(--on-accent);}

/* ===== 4. MAIN / CARDS ===== */
main{padding:var(--sp-2) var(--sp-4) 0;}
.ex{position:relative;background:var(--s1);border-radius:var(--r-lg);margin-bottom:var(--sp-3);overflow:hidden;transition:opacity .25s,transform .2s var(--ease);}
.ex.next{box-shadow:0 0 0 1.5px var(--accent);}
.next-tag{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:var(--r-full);padding:1px 7px;margin-right:6px;font-size:10px;letter-spacing:.06em;}
.ex.done:not(.open){opacity:.7;}
.ex.done:not(.open) .ex-head{padding:10px var(--sp-4);}
.ex.done:not(.open) .ex-tag,.ex.done:not(.open) .ex-meta,.ex.done:not(.open) .ex-stat .sub{display:none;}
.ex.done:not(.open) .ex-name{font-size:var(--t-sm);font-weight:600;color:var(--txt-2);margin:0;}
.ex.done:not(.open) .check{flex-basis:24px;height:24px;border-radius:8px;}
.ex.done:not(.open) .check svg{width:13px;height:13px;}
.ex.done:not(.open) .ex-stat .big{font-size:var(--t-md);}
@keyframes pop{0%{transform:scale(.6);}55%{transform:scale(1.2);}100%{transform:scale(1);}}
.ex.fx-pop .check{animation:pop .4s var(--ease);}
@keyframes goldFlash{0%{color:var(--gold);transform:scale(1);}25%{color:var(--gold);transform:scale(1.25);text-shadow:0 0 16px var(--gold);}70%{color:var(--gold);}100%{color:var(--txt);transform:scale(1);}}
@keyframes prGlow{0%,60%{box-shadow:0 0 0 1.5px var(--gold),0 0 24px var(--gold-soft);}100%{box-shadow:none;}}
.ex.fx-pr{animation:prGlow 1.6s var(--ease);}
.ex.fx-pr .ex-stat .big{display:inline-block;transform-origin:right center;animation:goldFlash 1.6s var(--ease);}
@keyframes ringPulse{0%{transform:scale(1);}40%{transform:scale(1.14);filter:drop-shadow(0 0 10px var(--accent));}100%{transform:scale(1);}}
.ring.fx-pulse{animation:ringPulse .6s var(--ease);}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px) scale(.97);}}
.done-banner.fx-in{animation:slideIn .45s var(--ease);}
.ex-stat .sub{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:5px;}
.spark{width:44px;height:14px;display:block;overflow:visible;}
.ex.open{opacity:1;box-shadow:0 0 0 1px var(--accent-line);}
.graph-wrap{margin-bottom:var(--sp-3);}
.ex-head{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);cursor:pointer;}
.ex-head:active{background:var(--s2);}
.check{flex:0 0 30px;height:30px;border-radius:10px;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center;transition:.18s var(--ease);position:relative;}
.check::after{content:"";position:absolute;inset:-8px;}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:.18s var(--ease);}
.ex.done .check{background:var(--accent);border-color:var(--accent);}
.ex.done .check svg{opacity:1;transform:scale(1);}
.ex-info{flex:1;min-width:0;}
.ex-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);}
.ex-name{font-size:var(--t-md);font-weight:700;line-height:1.25;margin:2px 0;}
.ex-meta{font-size:var(--t-xs);color:var(--txt-2);}
.ex-meta .bw{color:var(--txt-3);}
.ex-stat{flex:0 0 auto;text-align:right;}
.ex-stat .big{font-family:var(--num);font-size:var(--t-lg);font-weight:800;line-height:1;letter-spacing:-.01em;}
.ex-stat .big small{font-size:var(--t-xs);font-weight:700;color:var(--txt-2);margin-left:1px;}
.ex-stat .tr{font-size:11px;font-weight:700;}
.ex-stat .none{font-size:var(--t-xs);color:var(--txt-3);}
.up{color:var(--up);}.down{color:var(--down);}.flat{color:var(--txt-3);}

.ex-body{display:none;padding:0 var(--sp-4) var(--sp-4);}
.ex.open .ex-body{display:block;animation:fadeIn .22s var(--ease);}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}

.sets-head{display:flex;gap:var(--sp-2);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);padding:var(--sp-2) 0;border-top:1px solid var(--line);}
.sets-head .c-n{flex:0 0 44px;}
.sets-head .c-v{flex:1;text-align:center;}
.sets-head .c-x{flex:0 0 32px;}
.set{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);}
.set-n{flex:0 0 44px;height:44px;border-radius:12px;background:var(--s2);font-family:var(--num);font-weight:800;color:var(--txt-2);display:flex;align-items:center;justify-content:center;transition:.15s var(--ease);}
.set-n:active{transform:scale(.94);}
.set.done .set-n{background:var(--accent);color:var(--on-accent);}
.set input{flex:1;min-width:0;height:44px;background:var(--s2);border:1px solid transparent;border-radius:12px;text-align:center;font-family:var(--num);font-size:var(--t-lg);font-weight:700;}
.set input::placeholder{color:var(--txt-3);font-weight:600;}
.set input:focus{outline:none;border-color:var(--accent);background:var(--s3);}
.set.done input{color:var(--accent);}
.set-del{flex:0 0 32px;height:44px;color:var(--txt-3);font-size:20px;}
.row-btns{display:flex;gap:var(--sp-2);margin-top:var(--sp-1);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 var(--sp-4);border-radius:14px;font-weight:700;font-size:var(--t-sm);transition:transform .16s var(--ease),background .2s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-ghost{background:var(--s2);color:var(--txt);}
.btn-dash{border:1.5px dashed var(--line);color:var(--txt-2);}
.btn-danger{background:#f8717122;color:var(--down);}
.btn.block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.hint{font-size:var(--t-xs);color:var(--txt-3);margin-top:var(--sp-2);line-height:1.4;}

.rest{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-4);}
.rest-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);margin-right:auto;}
.rest button{height:36px;padding:0 12px;border-radius:var(--r-full);background:var(--s2);font-family:var(--num);font-weight:700;font-size:var(--t-sm);color:var(--txt-2);}
.rest button.cur{background:var(--accent-soft);color:var(--accent);}

.sec-title{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);margin:var(--sp-5) 0 var(--sp-2);}
.sec-title .gold{color:var(--gold);letter-spacing:.02em;text-transform:none;font-size:var(--t-xs);}
.graph{width:100%;height:120px;display:block;}
.graph-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-3);margin-top:4px;}
.empty-note{font-size:var(--t-sm);color:var(--txt-3);padding:var(--sp-2) 0;}
.hist{display:flex;align-items:center;gap:var(--sp-3);padding:10px 0;border-bottom:1px solid var(--line);}
.hist:last-child{border-bottom:none;}
.hist-d{flex:0 0 46px;font-size:var(--t-xs);color:var(--txt-3);font-weight:600;}
.hist-s{flex:1;font-size:var(--t-xs);color:var(--txt-2);font-family:var(--num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-v{font-family:var(--num);font-weight:800;font-size:var(--t-sm);}
.hist-x{color:var(--txt-3);width:28px;height:28px;}
.hist-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:var(--sp-4);padding:var(--sp-3) 0;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);}
.hist-toggle .chev{color:var(--accent);letter-spacing:.02em;text-transform:none;font-size:var(--t-xs);}
.hist-toggle[disabled]{cursor:default;}
.hist-toggle[disabled] span:last-child{color:var(--txt-3);text-transform:none;letter-spacing:0;}
.link{color:var(--accent);font-size:var(--t-xs);font-weight:700;padding:var(--sp-2) 0;}

.unify{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);margin-bottom:var(--sp-3);border-radius:12px;background:var(--gold-soft);font-size:var(--t-xs);color:var(--txt);line-height:1.4;}
.unify .mini{flex:0 0 auto;background:var(--gold);color:#241800;}
.edit-row{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-4);flex-wrap:wrap;}
.mini{height:36px;padding:0 12px;border-radius:10px;background:var(--s2);color:var(--txt-2);font-size:var(--t-xs);font-weight:700;}
.mini.danger{color:var(--down);}
.mini select,.mini-sel{height:36px;border-radius:10px;background:var(--s2);border:none;color:var(--txt-2);font-size:var(--t-xs);font-weight:700;padding:0 8px;}

.done-banner{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-lg);background:linear-gradient(135deg,var(--accent-soft),transparent);box-shadow:inset 0 0 0 1px var(--accent-line);margin-bottom:var(--sp-3);}
.done-banner .em{font-size:28px;}
.done-banner .db-t{flex:1;min-width:0;}
.db-share{flex:0 0 auto;background:var(--accent);color:var(--on-accent);}
.top-r{display:flex;gap:var(--sp-2);align-items:center;}
.sug-up{color:var(--accent);font-weight:700;}
.sug-keep{color:var(--txt-2);}
.ex-note{font-size:var(--t-xs);color:var(--txt-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ex.done:not(.open) .ex-note{display:none;}
.sug{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);margin-bottom:var(--sp-3);border-radius:12px;background:var(--s2);}
.sug.up{background:var(--accent-soft);}
.sug .si{font-size:20px;}
.sug .st{flex:1;min-width:0;}
.sug .st b{display:block;font-size:var(--t-sm);}
.sug.up .st b{color:var(--accent);}
.sug .st small{font-size:11px;color:var(--txt-2);line-height:1.3;}
.sug .mini{background:var(--accent);color:var(--on-accent);}
.note-btn{display:block;width:100%;text-align:left;margin-top:var(--sp-3);padding:10px var(--sp-3);border-radius:12px;background:var(--s2);font-size:var(--t-sm);font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note-btn span{color:var(--txt-3);font-weight:500;font-size:var(--t-xs);margin-left:4px;}
.share-img{width:100%;border-radius:var(--r-md);display:block;margin-bottom:var(--sp-3);box-shadow:0 0 0 1px var(--line);}
.rcard{display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;background:var(--s1);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-2);transition:transform .16s var(--ease);}
.rcard:active{transform:scale(.98);}
.rcard .rc-l{flex:1;min-width:0;}
.rcard .rc-day{display:block;font-size:var(--t-lg);font-weight:800;letter-spacing:-.01em;}
.rcard .rc-g{display:block;font-size:var(--t-sm);color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rcard .rc-m{display:block;font-size:var(--t-xs);color:var(--txt-3);margin-top:2px;}
.rcard .rc-st{flex:0 0 auto;font-size:var(--t-xs);font-weight:700;padding:6px 10px;border-radius:var(--r-full);background:var(--accent-soft);color:var(--accent);}
.rcard.st-partial .rc-st{background:var(--gold-soft);color:var(--gold);}
.rcard.st-done{opacity:.6;}
.rcard.st-done .rc-st{background:var(--s2);color:var(--txt-2);}
.restday{background:var(--s1);border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-4) var(--sp-3);text-align:center;margin-bottom:var(--sp-2);}
.restday .em{font-size:36px;line-height:1;margin-bottom:var(--sp-2);}
.restday>b{display:block;font-size:var(--t-lg);}
.restday p{font-size:var(--t-sm);color:var(--txt-2);margin:2px 0 var(--sp-3);}
.rd-row{display:flex;justify-content:space-between;gap:var(--sp-3);padding:10px 0;border-top:1px solid var(--line);font-size:var(--t-sm);text-align:right;}
.rd-row span{color:var(--txt-3);text-align:left;}
.done-banner b{display:block;font-size:var(--t-md);}
.done-banner span{font-size:var(--t-xs);color:var(--txt-2);}
.empty{text-align:center;padding:var(--sp-7) var(--sp-4) var(--sp-5);}
.empty .em{font-size:40px;margin-bottom:var(--sp-3);}
.empty b{display:block;font-size:var(--t-lg);margin-bottom:var(--sp-1);}
.empty p{color:var(--txt-2);font-size:var(--t-sm);margin-bottom:var(--sp-5);}
.stack{display:flex;flex-direction:column;gap:var(--sp-2);}

/* ===== PROGRESO / MÁS ===== */
.card{background:var(--s1);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-3);}
.card h3{font-size:var(--t-sm);font-weight:700;margin-bottom:var(--sp-3);}
.verdict{font-size:var(--t-lg);font-weight:700;line-height:1.3;letter-spacing:-.01em;}
.verdict em{font-style:normal;color:var(--accent);}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-top:var(--sp-4);}
.kpi{background:var(--s2);border-radius:var(--r-md);padding:var(--sp-3);}
.kpi b{display:block;font-family:var(--num);font-size:var(--t-xl);font-weight:800;line-height:1;}
.kpi span{font-size:11px;color:var(--txt-2);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3);}
.cal-nav b{text-transform:capitalize;font-size:var(--t-md);}
.cal-nav button{width:36px;height:36px;border-radius:10px;background:var(--s2);font-size:18px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal .dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--txt-3);padding-bottom:2px;}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-family:var(--num);font-size:var(--t-sm);color:var(--txt-3);}
.cal .d.on{background:var(--accent);color:var(--on-accent);font-weight:800;}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--txt-2);color:var(--txt);}
.cal .d.on.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent);}
.cal-foot{font-size:var(--t-xs);color:var(--txt-2);text-align:center;margin-top:var(--sp-3);}
.prow{display:flex;align-items:center;gap:var(--sp-3);padding:10px 0;border-bottom:1px solid var(--line);}
.prow:last-child{border-bottom:none;}
.prow .pn{flex:1;min-width:0;font-size:var(--t-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow .pd{font-family:var(--num);font-weight:800;font-size:var(--t-sm);white-space:nowrap;}
.prow .pv{font-family:var(--num);font-size:var(--t-xs);color:var(--txt-3);white-space:nowrap;}
.trophy{color:var(--gold);}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);}
.rec{background:var(--gold-soft);border-radius:var(--r-md);padding:var(--sp-3);min-width:0;}
.rec .rn{font-size:var(--t-xs);font-weight:600;color:var(--txt);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;}
.rec b{display:block;font-size:var(--t-xl);font-weight:800;color:var(--gold);line-height:1.1;margin-top:var(--sp-1);}
.rec b small{font-size:var(--t-xs);margin-left:1px;}
.rec span{font-size:11px;color:var(--txt-2);}
.mus{display:grid;grid-template-columns:96px 1fr 28px;gap:var(--sp-3);align-items:center;padding:6px 0;}
.mus .mt{font-size:var(--t-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mus .bar{height:10px;background:var(--s2);border-radius:var(--r-full);overflow:hidden;}
.mus .bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-full);}
.mus .mn{text-align:right;font-weight:800;font-size:var(--t-sm);}
.sess+.sess{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--line);}
.sess-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--sp-2);}
.sess-h b{font-size:var(--t-sm);}
.sess-h b span,.sess-h>span{font-size:var(--t-xs);color:var(--txt-3);font-weight:600;}
.srow{display:flex;align-items:center;gap:var(--sp-2);padding:7px 0;}
.srow .sn{flex:1;min-width:0;font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt-2);}
.srow .sb{font-size:var(--t-sm);font-weight:700;white-space:nowrap;}
.dchip{flex:0 0 auto;min-width:46px;text-align:center;padding:3px 7px;border-radius:var(--r-full);background:var(--s2);font-family:var(--num);font-size:11px;font-weight:800;color:var(--txt-3);}
.dchip.up{background:#4ade8022;color:var(--up);}
.dchip.down{background:#f8717122;color:var(--down);}
.dchip.new{font-family:var(--font);font-weight:700;}
.more-row{display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-3) 0;text-align:left;border-bottom:1px solid var(--line);}
.more-row:last-child{border-bottom:none;}
.more-row .ic{flex:0 0 40px;height:40px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:19px;}
.more-row .tx{flex:1;min-width:0;}
.more-row .tx b{display:block;font-size:var(--t-sm);}
.more-row .tx span{font-size:var(--t-xs);color:var(--txt-2);}
.more-row .ar{color:var(--txt-3);}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--s2);padding:4px;border-radius:14px;}
.seg button{height:40px;border-radius:10px;font-size:var(--t-sm);font-weight:700;color:var(--txt-2);}
.seg button.on{background:var(--s3);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.swatches{display:flex;gap:var(--sp-2);flex-wrap:wrap;}
.sw{width:42px;height:42px;border-radius:12px;position:relative;}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:15px;box-shadow:0 0 0 2px var(--txt);}
.foot{text-align:center;font-size:11px;color:var(--txt-3);margin:var(--sp-5) 0;}

/* ===== NAV INFERIOR ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#111419f2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h);}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--txt-3);font-size:11px;font-weight:700;}
.nav button svg{width:24px;height:24px;}
.nav button.on{color:var(--accent);}

/* ===== SHEET ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.sheet-bg.show{display:flex;animation:bgIn .2s;}
@keyframes bgIn{from{background:rgba(0,0,0,0);}}
.sheet{background:var(--s1);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:var(--sp-2) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom));animation:up .28s var(--ease);overscroll-behavior:contain;}
@keyframes up{from{transform:translateY(40px);opacity:.4;}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto var(--sp-3);}
.sheet h2{font-size:var(--t-xl);font-weight:800;letter-spacing:-.02em;margin-bottom:var(--sp-1);}
.sheet .lead{font-size:var(--t-sm);color:var(--txt-2);margin-bottom:var(--sp-4);line-height:1.45;}
.field{margin-bottom:var(--sp-3);}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);margin-bottom:6px;}
.inp{width:100%;height:48px;background:var(--s2);border:1px solid transparent;border-radius:12px;padding:0 14px;font-size:var(--t-md);font-weight:600;}
textarea.inp{height:120px;padding:12px 14px;font-size:var(--t-sm);font-family:ui-monospace,monospace;resize:vertical;}
.inp:focus{outline:none;border-color:var(--accent);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
.toggle{display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-3);background:var(--s2);border-radius:12px;text-align:left;margin-bottom:var(--sp-3);}
.toggle .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center;}
.toggle .box svg{width:14px;height:14px;opacity:0;}
.toggle.on .box{background:var(--accent);border-color:var(--accent);}
.toggle.on .box svg{opacity:1;}
.toggle b{display:block;font-size:var(--t-sm);}
.toggle small{font-size:var(--t-xs);color:var(--txt-2);}

/* biblioteca */
.search{position:sticky;top:-8px;background:var(--s1);padding-bottom:var(--sp-2);z-index:2;}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:var(--sp-2) 0;}
.fchips::-webkit-scrollbar{display:none;}
.lib-row{display:flex;align-items:center;gap:var(--sp-3);padding:10px 0;border-bottom:1px solid var(--line);}
.lib-row .tx{flex:1;min-width:0;}
.lib-row b{display:block;font-size:var(--t-sm);font-weight:700;}
.lib-row span{font-size:var(--t-xs);color:var(--txt-3);}
.add-b{flex:0 0 40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:700;}
.add-b.ok{background:var(--accent);color:var(--on-accent);font-size:16px;}

/* foto */
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);width:100%;padding:var(--sp-6) var(--sp-4);border:1.5px dashed var(--line);border-radius:var(--r-lg);color:var(--txt-2);font-weight:700;}
.pick .em{font-size:36px;}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:var(--r-md);background:var(--s2);margin-bottom:var(--sp-3);}
.or{display:flex;align-items:center;gap:var(--sp-3);color:var(--txt-3);font-size:var(--t-xs);font-weight:700;margin:var(--sp-4) 0;}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line);}
.grp{background:var(--s2);border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-3);}
.grp-h{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2);}
.grp-h b{flex:1 0 100%;font-size:var(--t-sm);}
.grp-h select{flex:1;height:38px;border-radius:10px;background:var(--s3);border:none;padding:0 8px;font-size:var(--t-xs);font-weight:700;}
.irow{display:grid;grid-template-columns:28px 1fr 46px 46px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);}
.irow input[type=text],.irow input[inputmode]{height:38px;background:var(--s3);border:1px solid transparent;border-radius:9px;padding:0 8px;font-size:var(--t-sm);font-weight:600;min-width:0;}
.irow input[inputmode]{text-align:center;font-family:var(--num);}
.irow input.miss{border-color:var(--gold);}
.irow .cb{width:22px;height:22px;accent-color:var(--accent);}
.irow.off{opacity:.4;}
.inote{grid-column:2/-1;font-size:11px;color:var(--txt-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.inote .warn{color:var(--gold);}
.inote button{color:var(--accent);font-weight:700;font-size:11px;}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:0 auto var(--sp-3);}
@keyframes sp{to{transform:rotate(360deg);}}

/* toast + timer */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,16px);background:var(--txt);color:var(--bg);padding:12px 20px;border-radius:var(--r-full);font-size:var(--t-sm);font-weight:700;opacity:0;transition:.25s var(--ease);pointer-events:none;z-index:80;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.pr{background:var(--gold);color:#241800;}
.rest-pill{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);max-width:536px;margin:0 auto;z-index:35;background:var(--s3);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px var(--accent-line);transform:translateY(calc(100% + 100px));visibility:hidden;transition:transform .3s var(--ease),background .3s,visibility 0s .3s;}
.rest-pill.show{transform:none;visibility:visible;transition:transform .3s var(--ease),background .3s;}
.rp-bar{height:4px;background:var(--s2);}
.rp-bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .25s linear;}
.rp-row{display:flex;align-items:center;gap:var(--sp-3);padding:8px 8px 8px var(--sp-4);}
.rp-row b{font-family:var(--num);font-size:var(--t-xl);font-weight:800;min-width:62px;letter-spacing:-.01em;}
.rp-n{flex:1;min-width:0;font-size:var(--t-xs);color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-row button{flex:0 0 auto;height:40px;min-width:46px;padding:0 12px;border-radius:12px;background:var(--s2);font-weight:700;font-size:var(--t-sm);}
@keyframes ding{50%{transform:scale(1.04);}}
.rest-pill.ding{background:var(--accent);animation:ding .45s var(--ease) 2;}
.rest-pill.ding .rp-row b,.rest-pill.ding .rp-n{color:var(--on-accent);}
.rest-pill.ding .rp-row button{background:#00000026;color:var(--on-accent);}
.rest-pill.ding .rp-bar{opacity:0;}
body.resting{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px);}
body.resting .toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 92px);}

@media (hover:hover) and (pointer:fine){
  .btn-ghost:hover,.mini:hover{background:var(--s3);}
  .ex-head:hover{background:#181c22;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

function clone(o){return JSON.parse(JSON.stringify(o));}
function estadoInicial(){return normalize({version:SCHEMA,routine:clone(DEFAULT_ROUTINE)});}
function normalize(d){
  d.stageName=d.stageName||"Etapa 1";
  d.routine=d.routine||clone(DEFAULT_ROUTINE);
  DAYS.forEach(k=>{if(!Array.isArray(d.routine[k]))d.routine[k]=[];});
  d.history=d.history||{};d.checks=d.checks||{};d.stages=d.stages||[];
  d.mode=d.mode==="custom"?"custom":"days";
  d.customList=d.customList||[];d.customRoutine=d.customRoutine||{};
  d.customList.forEach(r=>{if(!Array.isArray(d.customRoutine[r.id]))d.customRoutine[r.id]=[];});
  d.lastRest=d.lastRest||60;d.accent=d.accent||"#4ade80";
  if(d.lastKey===undefined)d.lastKey=null;
  if(d.todayPick===undefined)d.todayPick=null;
  d.hintSeen=!!d.hintSeen;
  d.notes=d.notes||{};       // nota por ejercicio (clave = nombre normalizado)
  d.sessions=d.sessions||{}; // {fecha:{s:inicio,e:última actividad}} en ms
  return d;
}
function migrar(d){
  const v=d.version||3;
  if(v>=SCHEMA)return normalize(d);
  try{localStorage.setItem(LS_KEY+"-backup-v"+v,JSON.stringify(d));}catch(e){}
  // v3 → v4: campos nuevos con default explícito, nada se borra
  normalize(d);
  // historial: asegurar números (versiones viejas podían guardar strings)
  Object.keys(d.history).forEach(k=>{
    d.history[k]=(d.history[k]||[]).filter(e=>e&&e.d&&Array.isArray(e.sets)).map(e=>({d:e.d,sets:e.sets.map(s=>({w:Number(s.w)||0,r:Number(s.r)||0}))}));
    if(!d.history[k].length)delete d.history[k];
  });
  d.version=SCHEMA;
  return d;
}
function cargar(){
  const raw=localStorage.getItem(LS_KEY);
  if(!raw)return estadoInicial();
  try{return migrar(JSON.parse(raw));}
  catch(e){
    localStorage.setItem(LS_KEY+"-corrupto-"+Date.now(),raw);
    alert("No se pudieron leer los datos guardados. Se preservó una copia.");
    return estadoInicial();
  }
}
let saveWarned=false;
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));saveWarned=false;}
  catch(e){if(!saveWarned){saveWarned=true;toast("⚠ No se pudo guardar en este celular");}}
}

   ========================================================= */
function uid(){return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function exKey(n){return String(n).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function dkey(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function todayKey(){return dkey(new Date());}
function todayShort(){return DAYS[(new Date().getDay()+6)%7];}
function fmtDate(k){const[y,m,d]=k.split("-");return d+"/"+m;}
function parseW(v){if(v===""||v==null)return NaN;return parseFloat(String(v).replace(",","."));}
function fmtW(w){w=Math.round(w*100)/100;return Number.isInteger(w)?String(w):String(w).replace(".",",");}
function mode(){return state.mode;}
function keysList(){return mode()==="days"?DAYS:state.customList.map(r=>r.id);}
function labelOf(k){if(mode()==="days")return DAY_FULL[k]||k;const r=state.customList.find(x=>x.id===k);return r?r.name:"Rutina";}
function arrOf(k){
  if(mode()==="days"){state.routine[k]=state.routine[k]||[];return state.routine[k];}
  state.customRoutine[k]=state.customRoutine[k]||[];return state.customRoutine[k];
}
function setArr(k,a){if(mode()==="days")state.routine[k]=a;else state.customRoutine[k]=a;}
function allExercises(){
  const o=[];DAYS.forEach(d=>(state.routine[d]||[]).forEach(e=>o.push(e)));
  Object.values(state.customRoutine).forEach(a=>a.forEach(e=>o.push(e)));return o;
}
function exHist(n){return state.history[exKey(n)]||[];}
function topW(e){return Math.max(...e.sets.map(s=>s.w));}
function topR(e){return Math.max(...e.sets.map(s=>s.r||0));}
function metric(e,bw){return bw?topR(e):topW(e);}
function prBest(n,bw){const h=exHist(n);return h.length?Math.max(...h.map(e=>metric(e,bw))):null;}
function lastEntry(n){const h=exHist(n);return h.length?h[h.length-1]:null;}
function deltaFor(n,bw){const h=exHist(n);if(h.length<2)return null;return metric(h[h.length-1],bw)-metric(h[h.length-2],bw);}
function mergeHistory(from,to){
  if(from===to||!state.history[from])return;
  const m=(state.history[to]||[]).concat(state.history[from]).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  state.history[to]=m;delete state.history[from];
  if(state.notes[from]){if(!state.notes[to])state.notes[to]=state.notes[from];delete state.notes[from];}
}
function trainedDates(){
  const s=new Set();Object.values(state.history).forEach(a=>a.forEach(e=>s.add(e.d)));
  Object.keys(state.checks).forEach(k=>{if(Object.keys(state.checks[k]||{}).length)s.add(k);});return s;
}
function prettyNameFor(key){
  const e=allExercises().find(x=>exKey(x.n)===key)||CATALOG.find(x=>exKey(x.n)===key);
  return e?e.n:null;
}
function knownKeys(){
  const s=new Set(Object.keys(state.history));allExercises().forEach(e=>s.add(exKey(e.n)));return s;
}
/* nombre parecido a uno que ya existe (para unificar historial) */
function similarExisting(name){
  const k=exKey(name);if(!k)return null;
  const ks=knownKeys();if(ks.has(k))return {exact:true,key:k};
  const cands=[...ks].filter(x=>x.startsWith(k+" ")||k.startsWith(x+" "));
  if(cands.length===1){const p=prettyNameFor(cands[0]);if(p)return {exact:false,key:cands[0],name:p};}
  return null;
}
/* otro nombre del mismo ejercicio que tiene historial (ej. "Leg extension" vs "Leg extension (cuádriceps)") */
function unifyCandidate(ex){
  const k=exKey(ex.n);
  const c=Object.keys(state.history).filter(h=>h!==k&&(h.startsWith(k+" ")||k.startsWith(h+" ")));
  if(c.length!==1)return null;
  const name=prettyNameFor(c[0]);
  return name?{key:c[0],name,count:state.history[c[0]].length}:null;
}
function unifyNames(ex,target){
  const oldK=exKey(ex.n),newK=exKey(target);
  allExercises().forEach(e=>{if(exKey(e.n)===oldK)e.n=target;});
  mergeHistory(oldK,newK);
}
/* mejor serie de un registro: la de más peso (y a igual peso, más reps) */
function bestSet(e,bw){
  if(bw)return {txt:topR(e)+" reps"};
  const b=e.sets.reduce((m,x)=>(x.w>m.w||(x.w===m.w&&x.r>m.r))?x:m,e.sets[0]);
  return {txt:fmtW(b.w)+"kg × "+b.r};
}
/* --- semana real: qué rutinas hiciste esta semana (lun-dom), sin importar el día --- */
function weekStartKey(){const n=new Date();return dkey(new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)));}
function weekCheckMap(){ // id de ejercicio -> última fecha en que se tildó esta semana
  const ws=weekStartKey(),m={};
  Object.keys(state.checks).forEach(d=>{if(d<ws)return;Object.keys(state.checks[d]||{}).forEach(id=>{if(!m[id]||d>m[id])m[id]=d;});});
  return m;
}
function routineWeek(k,wk){
  wk=wk||weekCheckMap();const exs=arrOf(k);let done=0,last=null;
  exs.forEach(e=>{if(wk[e.id]){done++;if(!last||wk[e.id]>last)last=wk[e.id];}});
  const total=exs.length;
  return {total,done,last,status:!total?"rest":done>=total?"done":done?"partial":"pending"};
}
const SHORT_G={Piernas:"Pierna",Glúteos:"Glúteo",Abdominales:"Abdom.",Oblicuos:"Core",Hombros:"Hombro"};
function groupsOf(k){
  const c={};arrOf(k).forEach(e=>{if(e.tag)c[e.tag]=(c[e.tag]||0)+1;});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]);
}
function shortGroup(k){const g=groupsOf(k)[0];return g?(SHORT_G[g]||g):"";}
function fmtDow(k){const[y,m,d]=k.split("-").map(Number);return ["dom","lun","mar","mié","jue","vie","sáb"][new Date(y,m-1,d).getDay()]+" "+d;}
function routinesOnDate(d){const ids=new Set(Object.keys(state.checks[d]||{}));return keysList().filter(k=>arrOf(k).some(e=>ids.has(e.id)));}
/* qué mostrar al abrir: lo elegido hoy, la rutina del día si está pendiente, o "¿qué entrenás?" */
function pickInitial(){
  const keys=keysList(),tk=todayKey(),wk=weekCheckMap();
  if(state.todayPick&&state.todayPick.d===tk&&keys.includes(state.todayPick.k))return state.todayPick.k;
  const pend=keys.some(k=>{const st=routineWeek(k,wk).status;return st==="pending"||st==="partial";});
  if(mode()==="days"){
    const wd=todayShort(),st=routineWeek(wd,wk);
    if(st.status!=="done"||st.last===tk)return wd;
    return pend?null:wd;
  }
  return pend?null:(keys[0]||null);
}

function weekReport(){
  const now=new Date(),from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6);
  const inW=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)>=from;};
  const names={};allExercises().forEach(e=>names[exKey(e.n)]={n:e.n,bw:!!e.bw,tag:e.tag});
  const byDate={},muscles={},recs={},dates=new Set();let sets=0,ups=0;
  Object.keys(state.history).forEach(k=>{
    const a=state.history[k];
    const cat=CATALOG.find(c=>exKey(c.n)===k);
    const info=names[k]||{n:prettyNameFor(k)||k,bw:a.every(e=>e.sets.every(x=>!x.w)),tag:cat?cat.tag:""};
    a.forEach((e,i)=>{
      if(!inW(e.d))return;
      dates.add(e.d);sets+=e.sets.length;
      const v=metric(e,info.bw),prevMax=i>0?Math.max(...a.slice(0,i).map(x=>metric(x,info.bw))):null;
      const delta=i>0?v-metric(a[i-1],info.bw):null,pr=prevMax!==null&&v>prevMax;
      if(delta>0)ups++;
      (byDate[e.d]=byDate[e.d]||[]).push({n:info.n,bw:info.bw,best:bestSet(e,info.bw).txt,delta,pr,sets:e.sets.length});
      const t=info.tag||"Otros";muscles[t]=(muscles[t]||0)+e.sets.length;
      if(pr&&(!recs[k]||recs[k].val<v))recs[k]={n:info.n,bw:info.bw,val:v,gain:v-prevMax};
    });
  });
  Object.keys(state.checks).forEach(k=>{if(inW(k)&&Object.keys(state.checks[k]).length)dates.add(k);});
  return {
    days:dates.size,sets,ups,
    records:Object.values(recs),
    muscles:Object.entries(muscles).sort((x,y)=>y[1]-x[1]),
    sessions:Object.keys(byDate).sort().reverse().map(d=>({d,items:byDate[d]}))
  };
}

function weightStep(w){return w>=40?5:2.5;}
function suggestFor(ex){
  const last=lastEntry(ex.n);if(!last||!last.sets.length)return null;
  const target=ex.r||12,planned=ex.s||3;
  const allReps=last.sets.length>=planned&&last.sets.every(x=>(x.r||0)>=target);
  if(ex.bw){
    const top=topR(last);
    return allReps?{up:true,r:top+1,txt:`Probá ${top+1} reps`,why:`la última hiciste todas las series con ${target}+`}
                  :{up:false,r:target,txt:`Buscá ${target} reps`,why:`la última no llegaste en todas`};
  }
  const top=topW(last);if(!top)return null;
  if(allReps){const w=Math.round((top+weightStep(top))*100)/100;return {up:true,w,txt:`Probá ${fmtW(w)}kg`,why:`la última completaste ${last.sets.length}×${target} con ${fmtW(top)}kg`};}
  const ok=last.sets.filter(x=>(x.r||0)>=target).length;
  return {up:false,w:top,txt:`Mantené ${fmtW(top)}kg`,why:`la última llegaste a ${target} reps en ${ok} de ${last.sets.length} series`};
}

function routineCardsHTML(keys,wk){

function renderTrain(){
  if(currentKey!==null&&!keysList().includes(currentKey))currentKey=pickInitial();

  const tk=todayKey(),exs=arrOf(currentKey),total=exs.length,wk=weekCheckMap(),st=routineWeek(currentKey,wk),done=st.done;
  const isTodayDay=mode()==="days"&&currentKey===todayShort();
  const isToday=isTodayDay||(state.todayPick&&state.todayPick.d===tk&&state.todayPick.k===currentKey);
  let eyebrow="&nbsp;";
  if(!total&&isTodayDay)eyebrow="Hoy · descanso";
  else if(isToday)eyebrow="Hoy";
  else if(st.status==="done")eyebrow=`✓ Hecha el ${fmtDow(st.last)}`;
  const groups=groupsOf(currentKey).slice(0,3).join(" · ");
  $top.innerHTML=`
    <div class="top-row">
      <button class="chip" id="stageChip">● ${esc(state.stageName)}</button>

      ${total?`<div class="ring${fx.complete?" fx-pulse":""}" aria-label="${done} de ${total} hechos">${ringSVG(done,total,64,6)}<div class="ring-lbl"><b>${done}</b><small>de ${total}</small></div></div>`:""}
    </div>${weekNav()}`;
  bindTop();

  if(done===total&&!editMode){
    const names=new Set(exs.map(e=>exKey(e.n)));
    const sets=[...names].reduce((a,k)=>a+(state.history[k]||[]).filter(e=>e.d===st.last).reduce((x,e)=>x+e.sets.length,0),0);
    const today=st.last===tk,mins=sessionMinutes(st.last,false),dur=mins&&mins>=5?` · ${fmtMin(mins)}`:"";

}

function sparkSVG(ex){
  const v=exHist(ex.n).slice(-8).map(e=>metric(e,ex.bw));if(v.length<2)return "";
  const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,W=44,H=14;
  const c=v.map((x,i)=>[(1+i*(W-2)/(v.length-1)).toFixed(1),(H-1.5-((x-mn)/r)*(H-3)).toFixed(1)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${c.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${c[c.length-1][0]}" cy="${c[c.length-1][1]}" r="2.2" fill="var(--accent)"/></svg>`;
}
function statHTML(ex){
  const last=lastEntry(ex.n);
  if(!last)return `<div class="ex-stat"><div class="none">sin datos</div></div>`;
  const v=ex.bw?topR(last):topW(last),d=deltaFor(ex.n,ex.bw);
  let tr="";
  if(d!==null)tr=d>0?`<span class="tr up">▲ +${fmtW(d)}</span>`:d<0?`<span class="tr down">▼ ${fmtW(-d)}</span>`:`<span class="tr flat">=</span>`;
  return `<div class="ex-stat num"><div class="big">${fmtW(v)}<small>${ex.bw?" reps":"kg"}</small></div><div class="sub">${sparkSVG(ex)}${tr}</div></div>`;
}

      ${(()=>{const sg=suggestFor(ex);if(!sg)return "";return `<div class="sug ${sg.up?"up":""}"><span class="si">${sg.up?"📈":"🎯"}</span><span class="st"><b>${esc(sg.txt)}</b><small>${esc(sg.why)}</small></span>${sg.up?`<button class="mini sug-use">Usar</button>`:""}</div>`;})()}
      <div class="sets-head"><span class="c-n">Serie</span>${ex.bw?"":'<span class="c-v">Peso kg</span>'}<span class="c-v">Reps</span><span class="c-x"></span></div>
      <div class="sets"></div>

      ${state.hintSeen?"":'<div class="hint">Tip: al terminar una serie tocá su número. Queda marcada y arranca el descanso.</div>'}
      <div class="rest"><span class="rest-lbl">Descanso</span>${[30,60,90,120].map(s=>`<button data-s="${s}" class="${state.lastRest===s?"cur":""}">${s}s</button>`).join("")}</div>

      fx.pop=ex.id;markPick();touchSession();if(routineWeek(currentKey).status==="done")fx.complete=true;
      if(navigator.vibrate)navigator.vibrate(15);

function defaultDraft(ex){
  const last=lastEntry(ex.n),a=[];
  for(let i=0;i<(ex.s||3);i++){const ls=last&&(last.sets[i]||last.sets[last.sets.length-1]);a.push({w:ls&&!ex.bw?fmtW(ls.w):"",r:ls?String(ls.r):String(ex.r||""),done:false});}
  return a;
}

function fillBody(card,ex,pr){
  card.dataset.filled="1";
  if(!drafts[ex.id])drafts[ex.id]=defaultDraft(ex);
  const box=card.querySelector(".sets");
  const renderSets=()=>{
    box.innerHTML="";
    drafts[ex.id].forEach((st,i)=>{
      const row=document.createElement("div");row.className="set"+(st.done?" done":"");
      row.innerHTML=`<button class="set-n">${st.done?"✓":i+1}</button>
        ${ex.bw?"":`<input class="s-w" inputmode="decimal" placeholder="kg" value="${esc(st.w)}" aria-label="Peso serie ${i+1}">`}
        <input class="s-r" inputmode="numeric" placeholder="${ex.r}" value="${esc(st.r)}" aria-label="Reps serie ${i+1}">
        <button class="set-del" aria-label="Quitar serie">×</button>`;
      row.querySelector(".set-n").onclick=()=>{
        st.done=!st.done;saveDrafts();renderSets();
        if(st.done){touchSession();save();}
        if(!state.hintSeen){state.hintSeen=true;save();const h=card.querySelector(".hint");if(h)h.remove();}
        if(st.done){const nx=drafts[ex.id].findIndex(x=>!x.done);startRest(state.lastRest,nx>=0?`Próxima: serie ${nx+1} de ${ex.n}`:`Última serie hecha. Tocá Guardar.`);}
      };
      if(!ex.bw)row.querySelector(".s-w").oninput=e=>{
        let v=e.target.value.replace(/[^0-9.,]/g,"");const p=v.search(/[.,]/);
        if(p!==-1)v=v.slice(0,p+1)+v.slice(p+1).replace(/[.,]/g,"");e.target.value=v;st.w=v;saveDrafts();
      };
      row.querySelector(".s-r").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"");st.r=e.target.value;saveDrafts();};
      row.querySelector(".set-del").onclick=()=>{drafts[ex.id].splice(i,1);saveDrafts();renderSets();};
      box.appendChild(row);
    });
  };
  renderSets();
  const su=card.querySelector(".sug-use");
  if(su)su.onclick=()=>{const sg=suggestFor(ex);drafts[ex.id].forEach(x=>{if(x.done)return;if(ex.bw)x.r=String(sg.r);else x.w=fmtW(sg.w);});saveDrafts();renderSets();toast(sg.txt);};
  card.querySelector(".note-btn").onclick=()=>openNoteEditor(ex);
  card.querySelector(".add-set").onclick=()=>{const d=drafts[ex.id],l=d[d.length-1];d.push({w:l?l.w:"",r:l?l.r:String(ex.r),done:false});saveDrafts();renderSets();};
  card.querySelectorAll(".rest button").forEach(b=>b.onclick=()=>startRest(+b.dataset.s));
  card.querySelector(".save").onclick=()=>{
    const d=drafts[ex.id];let sets;
    if(ex.bw){sets=d.filter(s=>/^\d+$/.test(s.r)).map(s=>({w:0,r:+s.r}));if(!sets.length)return toast("Cargá al menos una serie con reps");}
    else{sets=d.filter(s=>!isNaN(parseW(s.w))).map(s=>({w:parseW(s.w),r:parseInt(s.r)||ex.r}));if(!sets.length)return toast("Cargá al menos una serie con peso");}
    const k=exKey(ex.n);state.history[k]=state.history[k]||[];
    const val=ex.bw?Math.max(...sets.map(s=>s.r)):Math.max(...sets.map(s=>s.w));
    const isPR=pr!==null&&val>pr;
    state.history[k].push({d:todayKey(),sets});
    const tk=todayKey();state.checks[tk]=state.checks[tk]||{};state.checks[tk][ex.id]=true;
    markPick();touchSession();fx.pop=ex.id;if(isPR)fx.pr=ex.id;if(routineWeek(currentKey).status==="done")fx.complete=true;
    delete drafts[ex.id];saveDrafts();openCards.delete(ex.id);save();
    if(isPR){toast(`🏆 Récord: ${fmtW(val)}${ex.bw?" reps":"kg"}`,"pr");if(navigator.vibrate)navigator.vibrate([60,40,120]);}
    else toast("Guardado ✓");
    render();
  };
  const hl=card.querySelector(".hist-l"),ht=card.querySelector(".hist-toggle");
  const renderHist=()=>{
    const h=exHist(ex.n);
    if(!h.length){ht.innerHTML='<span>Gráfico e historial</span><span>sin registros</span>';ht.disabled=true;hl.innerHTML="";return;}
    const isOpen=histOpen.has(ex.id);
    ht.innerHTML=`<span>Gráfico e historial · ${h.length}</span><span class="chev">${isOpen?"Ocultar ▴":"Ver ▾"}</span>`;
    ht.onclick=()=>{isOpen?histOpen.delete(ex.id):histOpen.add(ex.id);renderHist();};
    if(!isOpen){hl.innerHTML="";return;}
    const all=histAll.has(ex.id),list=[...h].reverse(),shown=all?list:list.slice(0,5);
    hl.innerHTML="";
    const gw=document.createElement("div");gw.className="graph-wrap";hl.appendChild(gw);drawGraph(gw,ex);
    shown.forEach(e=>{
      const ri=h.indexOf(e);const row=document.createElement("div");row.className="hist";
      row.innerHTML=`<span class="hist-d">${fmtDate(e.d)}</span>
        <span class="hist-s">${ex.bw?e.sets.map(s=>s.r).join(" · "):e.sets.map(s=>fmtW(s.w)+"×"+s.r).join("  ")}</span>
        <span class="hist-v">${ex.bw?topR(e)+" r":fmtW(topW(e))+"kg"}</span><button class="hist-x" aria-label="Borrar registro">×</button>`;
      row.querySelector(".hist-x").onclick=()=>{
        if(!confirm(`¿Borrar el registro del ${fmtDate(e.d)} de ${ex.n}?`))return;
        const k=exKey(ex.n);state.history[k].splice(ri,1);if(!state.history[k].length)delete state.history[k];save();render();
      };
      hl.appendChild(row);
    });
    if(list.length>5){const b=document.createElement("button");b.className="link";b.textContent=all?"Ver menos":`Ver todo (${list.length})`;b.onclick=()=>{all?histAll.delete(ex.id):histAll.add(ex.id);renderHist();};hl.appendChild(b);}
  };
  renderHist();
}

/* gráfico con escala honesta, últimas 12 sesiones y récord en dorado */
function drawGraph(holder,ex){
  const all=exHist(ex.n).map(e=>({d:e.d,v:metric(e,ex.bw)}));
  if(all.length<2){holder.innerHTML='<div class="empty-note">Con 2 entrenamientos guardados aparece la curva.</div>';return;}
  const pts=all.slice(-12),vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs);
  const mg=Math.max((mx-mn)*.5,mx*.15,2);let lo=Math.max(0,Math.floor(mn-mg)),hi=Math.ceil(mx+mg*.4);if(hi-lo<4)hi=lo+4;
  const W=520,H=120,px=6,pt=12,pb=10,ph=H-pt-pb,sx=(W-px*2)/(pts.length-1),y=v=>pt+ph-((v-lo)/(hi-lo))*ph;
  const c=pts.map((p,i)=>[px+i*sx,y(p.v)]);
  const line=c.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=line+` L${c[c.length-1][0].toFixed(1)} ${pt+ph} L${c[0][0].toFixed(1)} ${pt+ph} Z`;
  const allMax=Math.max(...all.map(p=>p.v)),mi=mx===allMax?vs.lastIndexOf(allMax):-1;
  const refs=[hi,Math.round((lo+hi)/2),lo].map(v=>{const yy=y(v).toFixed(1);return `<line x1="${px}" y1="${yy}" x2="${W-px}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${W-px}" y="${yy-4}" text-anchor="end" font-size="11" fill="var(--txt-3)">${fmtW(v)}</text>`;}).join("");
  const dots=c.map((q,i)=>i===mi?`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="6" fill="var(--gold)" stroke="var(--s1)" stroke-width="2"/>`:`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join("");
  holder.innerHTML=`<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${refs}<path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dots}</svg>

function renderCal(){
  const t=trainedDates(),first=new Date(calY,calM,1),start=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate(),tk=todayKey();

  for(let d=1;d<=dim;d++){const k=dkey(new Date(calY,calM,d)),on=t.has(k);if(on)n++;h+=`<span class="d${on?" on":""}${k===tk?" today":""}">${d}</span>`;}

}

const $sheetBg=document.getElementById("sheetBg"),$sheet=document.getElementById("sheet");
/* El gesto/botón "atrás" del celular cierra la hoja abierta (y desde Progreso/Más vuelve a Entrenar)
   en vez de salir de la app: cada hoja y cada pestaña agrega una entrada al historial del navegador. */
let sheetPushed=false,viewPushed=false,ignorePop=0,sheetOnClose=null;
function openSheet(html,bind,onClose){
  if(!$sheetBg.classList.contains("show")){try{history.pushState({sheet:1},"");sheetPushed=true;}catch(e){}}
  sheetOnClose=onClose||null;
  $sheet.innerHTML='<div class="grab"></div>'+html;$sheetBg.classList.add("show");$sheet.scrollTop=0;if(bind)bind($sheet);
}
function hideSheet(){$sheetBg.classList.remove("show");const cb=sheetOnClose;sheetOnClose=null;if(cb)cb();}
function closeSheet(){
  if(!$sheetBg.classList.contains("show"))return;
  hideSheet();
  if(sheetPushed){sheetPushed=false;ignorePop++;history.back();}
}
/* cierra la hoja y vuelve a Entrenar deshaciendo todas las entradas propias de una sola vez */
function unwindToTrain(){
  let n=0;if(sheetPushed){n++;sheetPushed=false;}if(viewPushed){n++;viewPushed=false;}
  hideSheet();view="train";
  if(n){ignorePop++;history.go(-n);}
}
window.addEventListener("popstate",()=>{
  if(ignorePop>0){ignorePop--;return;}
  if($sheetBg.classList.contains("show")){sheetPushed=false;hideSheet();return;}
  if(view!=="train"){viewPushed=false;view="train";editMode=false;render();window.scrollTo(0,0);}
});
$sheetBg.addEventListener("click",e=>{if(e.target===$sheetBg)closeSheet();});

/* ---------- imagen para compartir ---------- */
function shareData(k,date){
  const exs=arrOf(k),rows=[];let sets=0,prs=0;
  exs.forEach(ex=>{
    const h=exHist(ex.n),i=h.map(e=>e.d).lastIndexOf(date);
    if(i<0){if((state.checks[date]||{})[ex.id])rows.push({n:ex.n,best:"✓",pr:false,delta:null,bw:ex.bw});return;}
    const e=h[i],v=metric(e,ex.bw);
    const pr=i>0&&v>Math.max(...h.slice(0,i).map(x=>metric(x,ex.bw)));
    const delta=i>0?v-metric(h[i-1],ex.bw):null;
    sets+=e.sets.length;if(pr)prs++;
    rows.push({n:ex.n,best:bestSet(e,ex.bw).txt,pr,delta,bw:ex.bw});
  });
  return {title:labelOf(k),groups:groupsOf(k).slice(0,3).join(" · "),date,rows,sets,prs,mins:sessionMinutes(date,false)};
}

  const fit=(t,max)=>{if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+"…").width>max)t=t.slice(0,-1);return t+"…";};
  x.fillStyle="#0d0f12";x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(140,80,0,140,80,760);g.addColorStop(0,A+"33");g.addColorStop(1,"#0d0f1200");x.fillStyle=g;x.fillRect(0,0,W,H);
  const P=80;
  // logo: anillo con pesa
  x.lineWidth=10;x.strokeStyle="#262b34";x.beginPath();x.arc(P+34,P+34,28,0,Math.PI*2);x.stroke();

  x.fillStyle="#eceef2";x.font=`800 30px ${F}`;x.textBaseline="middle";x.fillText("Mi Rutina",P+84,P+34);

function resizeImage(file,maxSide){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,maxSide/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      const url=c.toDataURL("image/jpeg",.85);res({url,b64:url.split(",")[1]});
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"));};img.src=u;

/* parseo + validación (puro) */
function parseRoutineJSON(text){
  text=String(text||"").replace(/```(json)?/gi,"").trim();
  const a=text.indexOf("{"),b=text.lastIndexOf("}");
  if(a<0||b<a)throw new Error("No encontré JSON en la respuesta");
  let j;try{j=JSON.parse(text.slice(a,b+1));}catch(e){throw new Error("La respuesta no es JSON válido");}
  const dias=Array.isArray(j.dias)?j.dias:Array.isArray(j.ejercicios)?[{nombre:"Rutina",ejercicios:j.ejercicios}]:null;
  if(!dias)throw new Error('Falta la lista "dias"');
  const toInt=v=>{if(v===null||v===undefined||v==="")return null;const n=parseInt(String(v).replace(/\D/g,""));return isNaN(n)||n<=0||n>300?null:n;};
  const groups=dias.map((d,i)=>({name:String(d.nombre||`Grupo ${i+1}`).trim(),rows:(Array.isArray(d.ejercicios)?d.ejercicios:[])
    .map(e=>({n:String(e.nombre||"").trim(),tag:String(e.grupo||"").trim(),s:toInt(e.series),r:toInt(e.reps),bw:e.peso_corporal===true,on:true}))
    .filter(e=>e.n)})).filter(g=>g.rows.length);
  if(!groups.length)throw new Error("No se encontraron ejercicios");
  return groups;
}
function guessDay(name){
  const k=exKey(name);const map={lun:"Lun",mar:"Mar",mie:"Mié",jue:"Jue",vie:"Vie",sab:"Sáb",dom:"Dom"};
  for(const p in map)if(k.startsWith(p)||k.includes(" "+p))return map[p];return null;
}
function openImportPreview(groups){
  groups.forEach(g=>{
    if(mode()==="days")g.dest=guessDay(g.name)||currentKey||todayShort();
    else{const ex=state.customList.find(r=>exKey(r.name)===exKey(g.name));g.dest=ex?ex.id:"__new__";}
    g.how="add";
  });
  const draw=()=>{
    const keepScroll=$sheet.scrollTop;
    let total=0,miss=0,dups=0;
    const html=groups.map((g,gi)=>{
      const existing=g.dest==="__new__"?new Set():new Set(arrOf(g.dest).map(e=>exKey(e.n)));
      const opts=(mode()==="days"?DAYS.map(d=>[d,DAY_FULL[d]]):state.customList.map(r=>[r.id,r.name]).concat([["__new__","Nueva rutina: "+g.name]]))
        .map(([v,l])=>`<option value="${esc(v)}"${v===g.dest?" selected":""}>${esc(l)}</option>`).join("");
      const cnt=g.dest==="__new__"?0:arrOf(g.dest).length;
      const rows=g.rows.map((r,ri)=>{
        const dup=g.how==="add"&&existing.has(exKey(r.n));if(dup&&r.on===true&&!r.touched){r.on=false;}
        if(r.on){total++;if(r.s===null||r.r===null)miss++;}if(dup)dups++;
        const sim=similarExisting(r.n);
        const notes=[];
        if(r.s===null||r.r===null)notes.push('<span class="warn">no se leyó series/reps — completalo</span>');
        if(dup)notes.push('<span class="warn">ya está en ese día</span>');
        if(sim&&sim.exact)notes.push("✓ con historial");
        else if(sim)notes.push(`¿Es «${esc(sim.name)}»? <button data-sg="${gi}:${ri}">usar</button>`);
        notes.push(`<button data-bw="${gi}:${ri}">${r.bw?"peso corporal ✓":"con peso"}</button>`);
        return `<div class="irow${r.on?"":" off"}"><input type="checkbox" class="cb" data-on="${gi}:${ri}"${r.on?" checked":""} aria-label="Incluir">
          <input type="text" data-n="${gi}:${ri}" value="${esc(r.n)}" aria-label="Nombre">
          <input inputmode="numeric" data-s="${gi}:${ri}" value="${r.s??""}" placeholder="ser" class="${r.s===null?"miss":""}" aria-label="Series">
          <input inputmode="numeric" data-r="${gi}:${ri}" value="${r.r??""}" placeholder="reps" class="${r.r===null?"miss":""}" aria-label="Reps">
          <div class="inote">${notes.join(" · ")}</div></div>`;
      }).join("");
      return `<div class="grp"><div class="grp-h"><b>📄 ${esc(g.name)} <span class="hint">(${g.rows.length})</span></b>
        <select data-dest="${gi}">${opts}</select>
        <select data-how="${gi}"><option value="add"${g.how==="add"?" selected":""}>Agregar</option><option value="replace"${g.how==="replace"?" selected":""}>Reemplazar${cnt?` (${cnt} actuales)`:""}</option></select></div>${rows}</div>`;
    }).join("");
    openSheet(`<h2>Revisá antes de guardar</h2><p class="lead">Esto es lo que se leyó. Corregí nombres y números, elegí a qué ${mode()==="days"?"día":"rutina"} va cada grupo y destildá lo que no quieras.${miss?` <b style="color:var(--gold)">${miss} con datos faltantes</b> (si los dejás vacíos queda 3×12).`:""}</p>
      ${html}<button class="btn btn-primary block" id="impOk"${total?"":" disabled"}>Cargar ${total} ${total===1?"ejercicio":"ejercicios"}</button>
      <button class="btn btn-ghost block" id="impC" style="margin-top:var(--sp-2)">Cancelar</button>`,s=>{
      const at=(attr,fn)=>s.querySelectorAll(`[${attr}]`).forEach(el=>{const[g,r]=el.getAttribute(attr).split(":").map(Number);fn(el,groups[g],r!==undefined&&!isNaN(r)?groups[g].rows[r]:null);});
      at("data-on",(el,g,r)=>el.onchange=()=>{r.on=el.checked;r.touched=true;draw();});
      at("data-n",(el,g,r)=>el.onchange=()=>{r.n=el.value.trim();draw();});
      at("data-s",(el,g,r)=>el.oninput=()=>{el.value=el.value.replace(/\D/g,"");r.s=el.value?+el.value:null;el.classList.toggle("miss",!el.value);});
      at("data-r",(el,g,r)=>el.oninput=()=>{el.value=el.value.replace(/\D/g,"");r.r=el.value?+el.value:null;el.classList.toggle("miss",!el.value);});
      at("data-sg",(el,g,r)=>el.onclick=()=>{r.n=similarExisting(r.n).name;draw();});
      at("data-bw",(el,g,r)=>el.onclick=()=>{r.bw=!r.bw;draw();});
      at("data-dest",(el,g)=>el.onchange=()=>{g.dest=el.value;g.rows.forEach(r=>{r.touched=false;r.on=true;});draw();});
      at("data-how",(el,g)=>el.onchange=()=>{g.how=el.value;g.rows.forEach(r=>{r.touched=false;r.on=true;});draw();});
      s.querySelector("#impC").onclick=closeSheet;
      s.querySelector("#impOk").onclick=()=>commitImport(groups);
    });
    $sheet.scrollTop=keepScroll;
  };
  draw();
}
function commitImport(groups){
  const repl=groups.filter(g=>g.how==="replace"&&g.dest!=="__new__"&&arrOf(g.dest).length);
  if(repl.length&&!confirm("Se van a reemplazar: "+repl.map(g=>`${labelOf(g.dest)} (${arrOf(g.dest).length} ejercicios)`).join(", ")+". El historial de pesos no se borra. ¿Seguir?"))return;
  let n=0,lastDest=null;
  groups.forEach(g=>{
    const rows=g.rows.filter(r=>r.on&&r.n);if(!rows.length)return;
    let dest=g.dest;
    if(dest==="__new__"){dest=uid();state.customList.push({id:dest,name:g.name});state.customRoutine[dest]=[];}
    if(g.how==="replace")setArr(dest,[]);
    rows.forEach(r=>{arrOf(dest).push({id:uid(),n:r.n,tag:r.tag,s:r.s||3,r:r.r||12,bw:r.bw,src:"foto"});n++;});
    lastDest=dest;
  });
  save();
  if(lastDest){currentKey=lastDest;unwindToTrain();}else closeSheet();
  render();toast(`Cargados ${n} ejercicios`);
}

document.getElementById("fileJson").onchange=e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;

    if(!d||typeof d!=="object"||!d.history||!d.routine)return alert("El archivo no tiene la forma de un respaldo de Mi Rutina.");

    const nEx=Object.values(d.routine).reduce((a,x)=>a+x.length,0)+Object.values(d.customRoutine).reduce((a,x)=>a+x.length,0);
    const nReg=Object.values(d.history).reduce((a,x)=>a+x.length,0);
    if(!confirm(`Respaldo con ${nEx} ejercicios en la rutina y ${nReg} entrenamientos guardados (etapa "${d.stageName}").\n\nReemplaza TODO lo que hay ahora en este celular. ¿Seguir?`))return;
    state=d;save();drafts={};saveDrafts();applyTheme();
    currentKey=pickInitial();
    toast("Datos importados");render();
  };
  rd.readAsText(f);
};

/* =========================================================
   TIMER
   ========================================================= */
const $pill=document.getElementById("restPill"),$rpT=document.getElementById("rpT"),$rpN=document.getElementById("rpN"),$rpBar=document.getElementById("rpBar");
let restInt=null,restTotal=0,restEnd=0,wake=null,dingT=null;
async function lockOn(){try{if("wakeLock" in navigator)wake=await navigator.wakeLock.request("screen");}catch(e){}}
function lockOff(){try{wake&&wake.release();}catch(e){}wake=null;}
function fmtClock(x){return Math.floor(x/60)+":"+String(x%60).padStart(2,"0");}
function startRest(sec,next){
  state.lastRest=sec;save();
  document.querySelectorAll(".rest button").forEach(b=>b.classList.toggle("cur",+b.dataset.s===sec));
  clearTimeout(dingT);$pill.classList.remove("ding");
  restTotal=sec;restEnd=Date.now()+sec*1000;$rpN.textContent=next||"Descanso";
  $pill.classList.add("show");document.body.classList.add("resting");
  lockOn();tick();clearInterval(restInt);restInt=setInterval(tick,250);
}
function tick(){ // basado en reloj: no se atrasa si el celu frena el intervalo
  const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  $rpT.textContent=fmtClock(left);$rpBar.style.transform=`scaleX(${restTotal?left/restTotal:0})`;
  if(left<=0)endRest(true);
}
function hidePill(){clearTimeout(dingT);$pill.classList.remove("show","ding");document.body.classList.remove("resting");}
function endRest(alarm){
  clearInterval(restInt);lockOff();
  if(!alarm)return hidePill();
  beep();if(navigator.vibrate)navigator.vibrate([300,120,300,120,300]);
  $rpT.textContent="0:00";$rpN.textContent="¡A la próxima serie!";$pill.classList.add("ding");
  dingT=setTimeout(hidePill,3000);
}
document.getElementById("rpX").onclick=()=>endRest(false);
document.getElementById("rpAdd").onclick=()=>{
  if($pill.classList.contains("ding")){startRest(15,"+15s extra");return;}
  restEnd+=15000;restTotal=Math.max(restTotal,Math.ceil((restEnd-Date.now())/1000));tick();
};
function beep(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,.55,1.1].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;
      g.gain.setValueAtTime(.001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,ctx.currentTime+t+.01);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.42);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.45);});}catch(e){}
}

/* =========================================================
   6. EVENTOS / UTILIDADES
   ========================================================= */
function toast(m,kind){const t=document.getElementById("toast");t.textContent=m;t.className="toast show"+(kind?" "+kind:"");clearTimeout(t._t);t._t=setTimeout(()=>t.className="toast",1900);}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(()=>true,()=>fallback());
  return Promise.resolve(fallback());
  function fallback(){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}a.remove();return ok;}
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
  const v=b.dataset.view;if(v===view)return;
  if(view==="train"&&v!=="train"){try{history.pushState({view:1},"");viewPushed=true;}catch(e){}}
  else if(v==="train"&&viewPushed){viewPushed=false;ignorePop++;history.back();}
  view=v;editMode=false;render();window.scrollTo(0,0);
});
window.addEventListener("beforeunload",e=>{
  if(Object.values(drafts).some(a=>Array.isArray(a)&&a.some(s=>s.done))){e.preventDefault();e.returnValue="";}
});

setInterval(()=>{const c=document.getElementById("sessChip");if(c){const m=sessionMinutes(todayKey(),true);if(m!==null)c.textContent="⏱ "+fmtMin(m);}},30000);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||todayKey()===renderedDay)return;
  renderedDay=todayKey();drafts={};saveDrafts();openCards.clear();
  if(view==="train"){currentKey=pickInitial();render();}
});
/* 7. INIT */
applyTheme();render();
</script>
